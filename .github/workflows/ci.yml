name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The real, previously-acknowledged-but-unverified risk this project has
  # carried since phase 1: better-sqlite3 prebuilds and detached-process
  # spawn/kill semantics were only ever code-reviewed for Windows/Ubuntu, not
  # actually run there. This matrix is what closes that gap - and it's what
  # actually found two real bugs the first time it ran for real (see the
  # --ignore-scripts and engines notes below).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # better-sqlite3@13 bundles a prebuilt binary for every platform this
      # matrix covers directly in its own published tarball - getBinding()
      # (its own lib/binding.js) resolves it lazily at first require(), with
      # no install-time step needed at all. But npm's own default lifecycle
      # for a package with a binding.gyp still attempts `node-gyp rebuild`
      # during `npm ci` regardless of `gypfile: false` in that package's own
      # package.json (an npm/better-sqlite3 interaction, not something
      # controllable from here) - harmless-but-wasteful where a C++
      # toolchain happens to be present (macOS/Linux), but a hard install
      # failure on windows-latest, which has no MSVC Build Tools installed
      # by default: confirmed for real, this is exactly what failed the
      # first time this matrix ever ran (real Visual Studio toolchain
      # missing, not a docmanager bug). --ignore-scripts skips that
      # unnecessary step entirely; verified locally that every real
      # operation (opening a real database, running the full test suite)
      # still works correctly from the bundled prebuild alone.
      - run: npm ci --ignore-scripts
      # Must run BEFORE `npm run build` below, which regenerates
      # skills/docmanager/SKILL.md from src/skill.js unconditionally -
      # checking after that step would always pass trivially. This checks
      # the file actually committed to the repo, catching a future change
      # that edits src/skill.js (or the committed file directly) without
      # keeping the other in sync.
      - run: npm run build:skill:check
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run

  # engines now pins ">=22", not the ">=20" this job used to test - that
  # original floor was never actually true. Confirmed directly, not just
  # inferred: better-sqlite3@13 (and lavish-axi, also a direct dependency)
  # both declare their own `engines: {node: ">=22"}`, and running this
  # project's real daemon under Node 20 segfaults (SIGSEGV) the instant it
  # touches the SQLite index - not a catchable JS error, the whole process
  # just vanishes, which is exactly what made this look like a mysterious
  # "fetch failed" from the CLI side before the real cause was traced.
  # Pinned to 22.0.0 specifically, not a bare "22" (which the matrix job
  # above already resolves to the latest 22.x and would make this job pure
  # duplication) - this tests the actual minimum of the declared range, the
  # one thing the matrix job doesn't cover.
  node-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.0.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
